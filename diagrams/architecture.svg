<text x="781.5" y="504" font-size="12" fill="#A9B6C2">kube-state-metrics,</text>
<text x="781.5" y="519" font-size="12" fill="#A9B6C2">node-exporter; no volumes</text>
<text x="26" y="585" font-size="12" fill="#A9B6C2">Node group <tspan font-family="'DejaVu Sans Mono', Consolas, Menlo, monospace" font-size="0.92em">main</tspan>: t3.medium Spot, AL2023, 1 to 4 (2 at start) across the 3 private subnets. Each node: kubelet, containerd.</text>
<text x="26" y="602" font-size="12" fill="#A9B6C2">Private egress: 0.0.0.0/0 to the NAT gateway in 2a, then IGW: image pulls (Docker Hub, registry.k8s.io, ECR) and AWS APIs. No VPC endpoints</text>
<text x="26" y="617" font-size="12" fill="#A9B6C2">in the repo.</text>
