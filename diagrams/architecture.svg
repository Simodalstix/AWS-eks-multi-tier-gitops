<title id="t">EKS GitOps lab architecture</title>
<desc id="d">Generated from scripts/study/diagrams/architecture.mjs. Users to the ALB (public subnets, HTTP :80) to frontend pod IPs directly (target-type: ip); the Service only tracks endpoints. All private subnets egress through the one NAT gateway in 2a.</desc>
